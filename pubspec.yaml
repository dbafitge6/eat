publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2+1
  path_provider: ^2.1.5
  path: ^1.9.0
  google_mobile_ads: ^8.0.0
