name: eat
description: "eat. - シンプルな食事管理アプリ"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2+1
  path_provider: ^2.1.5
  path: ^1.9.0
  webview_flutter: ^4.10.0
  share_plus: ^10.0.0
  fl_chart: ^0.70.0
  flutter_local_notifications: ^18.0.0
  intl: ^0.20.1
  shared_preferences: ^2.3.3
  table_calendar: ^3.1.3
  csv: ^6.0.0
  image_picker: ^1.1.2
  google_mobile_ads: ^8.0.0
  http: ^1.2.0
  in_app_purchase: ^3.2.0
  flutter_timezone: ^1.0.8
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "icon_1024.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/food_db/
